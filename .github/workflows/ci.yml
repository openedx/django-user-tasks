name: Python CI

on:
  pull_request:
    branches:
    - '**'
  workflow_call:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version:
        - '3.12'
        toxenv: [django42-celery53-drflatest, django52-celery54-drflatest,
          quality, docs]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}
        # Puts .venv/bin (with `coverage` from the ci group) on PATH so the
        # Codecov uploader can generate coverage.xml, as it did on master.
        activate-environment: true

    - name: Install Dependencies
      run: uv sync --locked --group ci

    - name: Run Tests
      run: uv run tox -e ${{ matrix.toxenv }}

    - name: Run coverage
      if: matrix.python-version == '3.12' && matrix.toxenv == 'django52-celery54-drflatest'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: unittests
        fail_ci_if_error: true
