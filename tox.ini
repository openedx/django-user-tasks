[tox]
envlist =
    py{312}-django{42, 52}-celery{53, 54}-drf{313,latest}
    quality
    docs
requires = tox-uv>=1

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    django42: django42
    django52: test
allowlist_externals = make
commands =
    make test PYTEST_ARGS="{posargs}"

[testenv:docs]
runner = uv-venv-lock-runner
dependency_groups = doc
allowlist_externals = make
commands =
    make docs BROWSER=true

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
allowlist_externals = make
commands =
    make quality

[pycodestyle]
exclude = .git,.tox,migrations
max-line-length = 120
